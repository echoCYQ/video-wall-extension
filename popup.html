<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      background: #12141c;
      color: #e6e8ee;
      font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 16px;
    }
    .head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .logo { width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0; }
    .title { font-size: 15px; font-weight: 700; }
    .subtitle { font-size: 11px; color: #8a90a3; margin-top: 1px; }
    .section-label {
      font-size: 11px;
      color: #8a90a3;
      margin: 14px 0 8px;
      letter-spacing: 0.5px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn {
      border: 1px solid #2a2e3d;
      background: #1c1f2b;
      color: #e6e8ee;
      border-radius: 10px;
      padding: 12px 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      font: inherit;
    }
    .btn:hover { background: #262b3b; border-color: #3a4158; }
    .btn:active { transform: scale(0.97); }
    .btn.full { grid-column: 1 / -1; padding: 11px; }
    .icon {
      display: block;
      width: 40px;
      height: 30px;
      margin: 0 auto 7px;
      border-radius: 4px;
    }
    .icon.lr { background: linear-gradient(90deg, #4f8cff 0 49%, transparent 49% 51%, #4f8cff 51% 100%); }
    .icon.tb { background: linear-gradient(180deg, #4f8cff 0 49%, transparent 49% 51%, #4f8cff 51% 100%); }
    .icon.g4 {
      background:
        linear-gradient(90deg, #4f8cff 0 49%, transparent 49% 51%, #4f8cff 51% 100%),
        linear-gradient(180deg, #4f8cff 0 49%, transparent 49% 51%, #4f8cff 51% 100%);
      background-size: 100% 100%;
    }
    .error {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #2a1d26;
      border: 1px solid #4a2f3a;
      color: #ff9aa8;
      font-size: 12px;
      display: none;
      word-break: break-all;
    }
    .error.show { display: block; }
    .shortcuts {
      margin-top: 12px;
      font-size: 11px;
      color: #666d82;
      border-top: 1px dashed #232739;
      padding-top: 10px;
    }
    kbd {
      background: #1c1f2b;
      border: 1px solid #333a50;
      border-radius: 4px;
      padding: 1px 5px;
      font-family: inherit;
      font-size: 10px;
      color: #aeb4c6;
    }
  </style>
</head>
<body>
  <div class="head">
    <img class="logo" src="icons/icon48.png" alt="" />
    <div>
      <div class="title">视频分屏墙</div>
      <div class="subtitle">在一个标签页内分屏，视频自动铺满</div>
    </div>
  </div>

  <div class="section-label">选择布局</div>
  <div class="grid-2">
    <button class="btn" id="split-lr" title="Ctrl+Shift+1">
      <span class="icon lr"></span>左右双屏
    </button>
    <button class="btn" id="split-tb" title="Ctrl+Shift+2">
      <span class="icon tb"></span>上下双屏
    </button>
    <button class="btn full" id="split-g4" title="Ctrl+Shift+3">
      <span class="icon g4"></span>四宫格分屏
    </button>
  </div>

  <div class="error" id="error"></div>
  <div class="shortcuts">
    快捷键：<kbd>Ctrl+Shift+1</kbd> 左右 · <kbd>Ctrl+Shift+2</kbd> 上下 · <kbd>Ctrl+Shift+3</kbd> 四宫格
  </div>

  <script src="popup.js"></script>
</body>
</html>
